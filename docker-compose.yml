services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docpilot
      POSTGRES_USER: docpilot
      POSTGRES_PASSWORD: docpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docpilot -d docpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DOCPILOT_DATABASE_URL: postgresql+psycopg://docpilot:docpilot@postgres:5432/docpilot
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
